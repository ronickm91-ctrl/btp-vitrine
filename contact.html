<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <title>Contact</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="bg-gray-100">

  <section class="py-24">

    <div class="container mx-auto px-6 max-w-3xl">

      <h1 class="text-5xl font-bold mb-10 text-center">
        Contactez-nous
      </h1>

      <form class="card flex flex-col gap-6">

        <input
          type="text"
          placeholder="Nom"
          class="p-4 rounded-xl border"
        >

        <input
          type="email"
          placeholder="Email"
          class="p-4 rounded-xl border"
        >

        <textarea
          placeholder="Votre message"
          rows="6"
          class="p-4 rounded-xl border"
        ></textarea>

        <button
          class="bg-orange-500 hover:bg-orange-600 text-white p-4 rounded-xl font-bold transition"
        >
          Envoyer
        </button>

      </form>

    </div>

  </section>

</body>
</html>
